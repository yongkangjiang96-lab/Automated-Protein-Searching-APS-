name: aps-lsbt
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
dependencies:
  # ProTrek-compatible inference stack and the packages called by APS.py.
  - python=3.10.12
  - pytorch=2.0.1
  - pytorch-cuda=11.7
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - numpy=1.25.2
  - scipy=1.11.4
  - pandas=2.0.3
  - scikit-learn=1.4.0
  - transformers=4.28.0
  - tokenizers=0.13.2
  - sentencepiece=0.1.99
  - biopython=1.83
  - pyyaml=6.0
  - joblib=1.3.2
  - tqdm=4.65.0
  - umap-learn=0.5.5
  - hdbscan=0.8.33
  - faiss-gpu=1.8.0
  - mmseqs2=15.6f452
  - pytest=8.2.0
  - pip=24.0
  - pip:
      - torchmetrics==0.9.3
      - pytorch-lightning==2.1.3
      - tabulate==0.9.0
      - easydict==1.13
      - lmdb==1.4.1
      - multiprocess==0.70.15
      - pyspellchecker==0.8.2
